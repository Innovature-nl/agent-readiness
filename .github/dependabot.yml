# Weekly, grouped per ecosystem. A release must be 5 days old before it gets a PR,
# so a compromised publish is usually pulled first; security updates are immediate.
version: 2

updates:
  - package-ecosystem: bun
    directories: ["/", "/web"]
    schedule: { interval: weekly, day: monday }
    cooldown:
      default-days: 5
    groups:
      bun: { patterns: ["*"] }
    # Tailwind 4 needs a migration of the dashboard's config and CSS, not a version bump.
    ignore:
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown:
      default-days: 5
    groups:
      github-actions: { patterns: ["*"] }
